<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        style-src 'self';
        script-src 'self';
        connect-src 'none';
        img-src 'self' data:;
        font-src 'self';
        object-src 'none';
        base-uri 'none';
      "
    />

    <title>DJ Sync Agent</title>

    <link
      rel="stylesheet"
      href="./styles.css"
    />
  </head>

  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">
            DJ
          </div>

          <div>
            <h1>DJ Sync Agent</h1>

            <p>
              Local sync control center
            </p>
          </div>
        </div>

        <div class="topbar-actions">
          <span
            id="connection-pill"
            class="connection-pill connection-pending"
          >
            <span class="status-dot"></span>
            <span id="connection-status">
              Connecting...
            </span>
          </span>

          <button
            id="refresh-service"
            class="icon-button"
            type="button"
            aria-label="Refresh application state"
          >
            ↻
          </button>
        </div>
      </header>

      <nav
        class="main-nav"
        aria-label="Main navigation"
      >
        <button
          id="nav-dashboard"
          class="nav-button nav-active"
          type="button"
          data-view="dashboard"
        >
          Dashboard
        </button>

        <button
          id="nav-library"
          class="nav-button"
          type="button"
          data-view="library"
        >
          Library
        </button>
      </nav>

      <main class="dashboard">
        <section
          id="view-dashboard"
          class="view-section production-workspace-view"
          aria-labelledby="production-workspace-title"
        >
          <h2 id="production-workspace-title" class="ds-sr-only">DJ Sync Production Workspace</h2>
          <div id="production-ui-root"></div>
        </section>

        <section
          id="view-library"
          class="view-section view-hidden"
          aria-labelledby="library-heading"
        >
          <section class="library-toolbar">
            <div>
              <div class="eyebrow">
                REKORDBOX
              </div>

              <h2 id="library-heading">
                Library
              </h2>

              <p
                id="library-summary"
                class="panel-subtitle"
              >
                Loading tracks...
              </p>
            </div>

            <div class="library-search">
              <input
                id="library-search"
                type="search"
                autocomplete="off"
                placeholder="Search tracks..."
                aria-label="Search tracks"
              />

              <button
                id="library-search-clear"
                class="button button-secondary"
                type="button"
              >
                Clear
              </button>
            </div>
          </section>

          <section class="library-layout">
            <article class="panel library-panel">
              <div
                id="library-error"
                class="inline-error"
              ></div>

              <div
                id="library-loading"
                class="library-loading"
              >
                Loading library...
              </div>

              <div
                id="library-empty"
                class="library-empty view-hidden"
              >
                No tracks found.
              </div>

              <div class="table-wrap">
                <table class="track-table">
                  <thead>
                    <tr>
                      <th>Title</th>
                      <th>Artist</th>
                      <th>Album</th>
                      <th>BPM</th>
                      <th>Key</th>
                      <th>Length</th>
                      <th>Rating</th>
                      <th></th>
                    </tr>
                  </thead>

                  <tbody
                    id="library-table-body"
                  ></tbody>
                </table>
              </div>

              <div class="library-footer">
                <span
                  id="library-page-status"
                >
                  —
                </span>

                <button
                  id="library-load-more"
                  class="button button-secondary"
                  type="button"
                >
                  Load more
                </button>
              </div>
            </article>

            <aside
              id="library-detail"
              class="panel track-detail-panel"
            >
              <div class="empty-state">
                Select a track to view details.
              </div>
            </aside>
          </section>
        </section>
      </main>
    </div>

    <script
      type="module"
      src="./renderer.js"
    ></script>
    <script
      type="module"
      src="./audio.js"
    ></script>
    <script
      type="module"
      src="./production-ui-entry.js"
    ></script>
  </body>
</html>
